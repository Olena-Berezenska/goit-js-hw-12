<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>goit-js-hw-11</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="header horizont-box">
      <form class="card js-form-inline search-form">
        <input type="text" name="imgSearch" placeholder="Search images..." />
        <button type="submit" class="btn btn-search">Search</button>
      </form>
    </div>
    <div class="loader hidden"></div>
    <ul class="gallery"></ul>
    <div class="btn-load-wrapper">
      <button
        type="button"
        class="btn btn-primary button js-btn-load hidden"
        data-action="load-more"
      >
        <span class="label">Load more</span>
      </button>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
